
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=FilmHubDb;Username=postgres;Password=${DB_PASSWORD}
      - TMDB_TOKEN=${TMDB_TOKEN}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__ChatId=${TELEGRAM_CHAT_ID}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
    depends_on:
      - db
    volumes:
      - posterdata:/app/wwwroot/images

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=FilmHubDb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  posterdata:
